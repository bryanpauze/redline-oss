[project]
name = "redline-oss"
dynamic = ["version"]
description = "Open-source security scanner for LLMs, agents, and MCP servers: prompt injection, jailbreaks, leakage, and more, with deterministic canary-based detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bryan Pauze" }]
keywords = ["llm", "security", "prompt-injection", "jailbreak", "red-team", "mcp", "ai-security", "oss"]
dependencies = []   # stdlib only, on purpose
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Intended Audience :: Developers",
]

[project.urls]
Repository = "https://github.com/bryanpauze/redline-oss"
Issues = "https://github.com/bryanpauze/redline-oss/issues"

[project.scripts]
redline = "redline.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "pytest-cov>=5",
       "mypy>=1.10", "bandit[toml]>=1.7", "detect-secrets>=1.4"]
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "redline.__version__"}

[tool.setuptools.packages.find]
include = ["redline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # optional extras (anthropic, ...) have no stubs
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["redline/fixtures/"]

[tool.bandit]
# redline is a security scanner: it deliberately does things bandit flags.
# Secrets are owned by detect-secrets (with a baseline), not bandit, so B105 is
# off here. The vulnerable MCP fixture is intentionally insecure -- don't scan it.
exclude_dirs = ["redline/fixtures", "tests"]
skips = [
  "B101",  # asserts document/enforce invariants (mypy-narrowing)
  "B105",  # "hardcoded passwords" are probe/golden attack payloads; secrets -> detect-secrets
  "B110",  # try/except/pass: a probe failure must never abort a scan
  "B311",  # random is for adversarial fuzzing/seeding, never for crypto
  "B310",  # urllib is deliberate outbound to targets; SSRF handled by egress.guard_resolved
  "B404",  # subprocess import is required to launch stdio MCP servers
  "B603",  # subprocess is called with shell=False and an argv list, by design
  "B613",  # covert-channel probes embed zero-width/homoglyph unicode on purpose
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "E701", "E702"]
