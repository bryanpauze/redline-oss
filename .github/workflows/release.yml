name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches version
        run: |
          V=$(python -c "import redline; print(redline.__version__)")
          T="${GITHUB_REF_NAME#v}"
          test "$V" = "$T" || { echo "tag $T != version $V"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
