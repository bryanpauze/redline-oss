name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python tests/test_redline.py
      - name: Smoke — scan (mock)
        run: redline scan --target mock --quiet || test $? -eq 1
      - name: Smoke — coverage matrix
        run: redline coverage
      - name: Smoke — MCP exfil certificate
        env:
          REDLINE_ENABLE_MCP_EXEC: "1"
        run: redline exfil-cert --mcp-command "python3 -m redline.fixtures.vuln_mcp_server" || test $? -eq 1
